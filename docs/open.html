<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Open in File Explorer</title>
<style>
  body { font-family: "Segoe UI", system-ui, sans-serif; background: #f6f6f6;
         color: #333; display: flex; height: 100vh; margin: 0; }
  main { margin: auto; max-width: 560px; padding: 2rem; background: #fff;
         border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  h1 { font-size: 1.2rem; margin: 0 0 .5rem; }
  p { line-height: 1.5; margin: .5rem 0; }
  code { background: #eef; padding: .1rem .4rem; border-radius: 4px;
         word-break: break-all; }
  button { font-size: 1rem; padding: .5rem 1.1rem; border: 1px solid #4472c4;
           border-radius: 4px; background: #4472c4; color: #fff; cursor: pointer; }
  #trouble { display: none; color: #7a4e00; margin-top: 1rem; }
</style>
</head>
<body>
<main>
  <h1>Open in File Explorer</h1>
  <p>Folder:</p>
  <p><code id="targetLabel"></code></p>
  <button id="open">Open folder</button>
  <div id="trouble">
    <p>No window opened in a few seconds? Then either the
       <strong>SMS DropboxOpener</strong> helper isn't installed on this
       machine, or the folder isn't synced locally. Please let IT know
       (include the location above).</p>
    <p><button type="button" id="retry" style="background:#eee;color:#333;border-color:#888;font-size:.85rem">Try again</button></p>
  </div>
</main>
<script>
(function () {
  var u = new URLSearchParams(location.search);
  var p = (u.get('p') || '').trim();
  var targetLabel = document.getElementById('targetLabel');
  var open = document.getElementById('open');
  var trouble = document.getElementById('trouble');

  if (!p) {
    document.querySelector('h1').textContent = 'No location given.';
    targetLabel.textContent =
      'This page is reached from intranet links, e.g. open.html?p=Projects.';
    open.style.display = 'none';
    return;
  }

  // Fixed scheme prefix; the query string can never produce another scheme.
  var target = 'opendbx://' +
    p.split('/').map(encodeURIComponent).join('/');
  targetLabel.textContent = target;

  // Firefox allows top-frame external-protocol navigation from script,
  // so on it we skip the button entirely: link click -> folder opens.
  // Chromium browsers (Chrome, Edge) require a user gesture for the
  // launch, which the button click provides.
  if (navigator.userAgent.indexOf('Firefox') >= 0) {
    try { location.replace(target); } catch (e) { /* button stays */ }
  }

  function launch() {
    trouble.style.display = 'none';
    // A user gesture is required for custom-scheme navigation in
    // Chrome/Edge, so this must live inside a click handler.
    try { location.replace(target); } catch (e) { showTrouble(); }
    // If the helper answered, this page unloads and nothing else runs.
    setTimeout(showTrouble, 1500);
  }
  function showTrouble() { trouble.style.display = 'block'; }

  open.addEventListener('click', launch);
  document.getElementById('retry').addEventListener('click', launch);
})();
</script>
</body>
</html>
